# Rédaction automatique des candidats ingest → PR fiches.
#
# Chaîne : ingest (CF, */30) écrit les candidats dans D1 → CE workflow (VPS,
# schedule) lit les candidats NEW → rédige selon docs/redaction-contract.md
# (contrat éditorial 1:1 des rafales) → PR fiche/<slug> → la validation agent
# prend le relais → le merge reste humain → publish-catalog.yml publie.
#
# Sécurité : opencode LIT les candidats et rédige, il n'exécute jamais leur
# contenu. Le rédacteur ne merge pas, ne déploie pas, ne touche pas au
# registre. Bornes : 3 fiches max par run, candidats rejetés marqués en D1.
# Pushes et PR passent par gh authentifié propriétaire (persist-credentials:
# false) : les workflows déclenchent normalement, pas de parking bot.

name: Rédaction candidats (ingest → PR)

on:
  schedule:
    # Toutes les 30 min, décalé de 10 min vs le cron ingest (7,37).
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: draft-fiches
  cancel-in-progress: false

env:
  D1_QUERY_URL: https://api.cloudflare.com/client/v4/accounts/8bf7b7311f17611f5b95f1f4e755f8e7/d1/database/613f348d-fb59-478c-8f53-84a8679f1ed9/query

jobs:
  rediger:
    runs-on: self-hosted
    # 24/08 : 50 min tuaient la moitié des rédactions en plein vol (opencode
    # vérifie chaque source par curl, ~10-15 min/fiche) — le filet de sécurité
    # reconvertissait les DRAFT en NEW : boucle catch-and-release, file 223.
    timeout-minutes: 110
    steps:
      - name: Checkout (sans persistance du token bot — pushes via gh/owner)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 22 + dépendances
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Sélection des candidats (3 max, marqués DRAFT)
        id: candidats
        run: |
          . /opt/francepassoire-shared/env.sh
          mkdir -p .agent-tmp
          python3 -c "import json; print(json.dumps({'sql': \"UPDATE candidates SET status = ?1 WHERE id IN (SELECT id FROM candidates WHERE status = 'NEW' ORDER BY created_at ASC LIMIT 6) RETURNING id, source, source_url, raw\", 'params': ['DRAFT']}))" > .agent-tmp/p.json
          curl -s "$D1_QUERY_URL" -H "Authorization: Bearer $FP_D1_TOKEN" -H "Content-Type: application/json" --data @.agent-tmp/p.json > .agent-tmp/candidates.json
          head -c 300 .agent-tmp/candidates.json; echo
          N=$(python3 -c "import json; d=json.load(open('.agent-tmp/candidates.json')); print(len(d['result'][0]['results']))" 2>/dev/null || echo 0)
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "Candidats sélectionnés : $N"

      - name: Rédaction (opencode, contrat éditorial intégral)
        if: steps.candidats.outputs.n != '0'
        # Modèle ÉPINGLÉ sur le plan GLM authentifié (24/08 : sans cette
        # épingle, opencode retombait sur zen anonyme → 429 en cascade →
        # 40 min de backoff par run pour ~10 min de vrai travail).
        # Choix modèle (propriétaire 24/08) : turbo pour LE VOLUME de la
        # rédaction — le contrat strict + la validation 5.3 gardent la
        # qualité ; monter à glm-5.2 si les PR déçoivent.
        run: |
          opencode run --model zai-coding-plan/glm-5-turbo "
          Tu es le rédacteur éditorial de FrancePassoire. Lis les candidats dans .agent-tmp/candidates.json (résultat D1 : id, source, source_url, raw) et le CONTRAT DE RÉDACTION INTÉGRAL dans docs/redaction-contract.md. Il est ta loi : barre d'inclusion, dédoublement, schéma, Ton A, interdits (em-dash, massif), vérification curl de CHAQUE source, archives web.archive.org pour les mortes, slug=date de revendication, statut confirmee seulement avec source officielle, group pour les dossiers ransomware.

          Pour CHAQUE candidat :
          1. Si la barre d'inclusion n'est pas franchie (mono-source après recherche, doublon du catalogue, pas une fuite, debunké, hors France) : écris une ligne dans .agent-tmp/verdicts.tsv : id<TAB>REJECTED<TAB>raison courte.
          2. Sinon rédige la fiche data/catalog/<slug>.json selon le contrat, vérifie les URLs (curl -sIL -A 'Mozilla/5.0', repli GET), puis :
             - node scripts/check-doublons.mjs --intra (la fiche signalée contre une existante pour le même incident → supprime-la et marque REJECTED doublon)
             - npx vitest run tests/pr-fiches.test.ts (tout doit rester vert)
             - écris id<TAB>DRAFTED<TAB>slug dans .agent-tmp/verdicts.tsv (le verdict DRAFTED est interne ; l'état D1 reste DRAFT)
          Tu ne touches RIEN en dehors de data/catalog/ et .agent-tmp/. Aucun merge, aucun push : je fais la suite.
          "

      - name: PR par fiche rédigée + mise à jour D1
        if: steps.candidats.outputs.n != '0'
        run: |
          . /opt/francepassoire-shared/env.sh
          git config user.name "aloyopenclaw"
          git config user.email "aloyopenclaw@users.noreply.github.com"
          [ -f .agent-tmp/verdicts.tsv ] || { echo "aucun verdict"; exit 0; }
          while IFS=$'\t' read -r ID VERDICT DETAIL; do
            [ -z "$ID" ] && continue
            if [ "$VERDICT" = "REJECTED" ]; then
              DETAIL_SAFE=$(printf '%s' "$DETAIL" | head -c 200 | tr -d "'\\" | tr '\t\n' '  ')
              printf '{"sql": "UPDATE candidates SET status = ?1, dedup_score = ?2 WHERE id = ?3", "params": ["REJECTED", "%s", "%s"]}' "$DETAIL_SAFE" "$ID" > .agent-tmp/p.json
              curl -s "$D1_QUERY_URL" -H "Authorization: Bearer $FP_D1_TOKEN" -H "Content-Type: application/json" --data @.agent-tmp/p.json >/dev/null
              echo "candidat $ID rejeté : $DETAIL"
            elif [ "$VERDICT" = "DRAFTED" ]; then
              SLUG="$DETAIL"
              if [ ! -f "data/catalog/$SLUG.json" ]; then echo "fiche absente pour $ID, DEFERRED"; continue; fi
              BR="fiche/$SLUG"
              git checkout -b "$BR" 2>/dev/null || git checkout "$BR"
              git add "data/catalog/$SLUG.json"
              git commit -m "feat(catalog): $SLUG rédigé depuis candidat ingest (rédaction automatique)" --quiet
              git push origin "$BR"
              gh pr create --head "$BR" --base main --title "Fiche : $SLUG (rédaction automatique)" \
                --body "Rédigé depuis un candidat d'ingestion par le workflow draft-fiches selon docs/redaction-contract.md. Validation agent en cours ; fusion = décision propriétaire." || true
              git checkout main
              printf '{"sql": "UPDATE candidates SET dedup_score = ?1 WHERE id = ?2", "params": ["drafted:%s", "%s"]}' "$ID" > .agent-tmp/p.json
              curl -s "$D1_QUERY_URL" -H "Authorization: Bearer $FP_D1_TOKEN" -H "Content-Type: application/json" --data @.agent-tmp/p.json >/dev/null
              echo "PR ouverte pour $SLUG (candidat $ID)"
            fi
          done < .agent-tmp/verdicts.tsv

      - name: Filet de sécurité D1 (les DRAFT orphelins redeviennent NEW)
        if: always()
        run: |
          . /opt/francepassoire-shared/env.sh
          mkdir -p .agent-tmp
          printf '%s' '{"sql": "UPDATE candidates SET status = ?1 WHERE status = ?2", "params": ["NEW", "DRAFT"]}' > .agent-tmp/p.json
          curl -s "$D1_QUERY_URL" -H "Authorization: Bearer $FP_D1_TOKEN" -H "Content-Type: application/json" --data @.agent-tmp/p.json >/dev/null
