# Notifications push téléphone du propriétaire (Pushinator).
#
# UN seul événement, celui qui demande une action du propriétaire :
#   - PR fiche/* ouverte (par draft-fiches) → « tap pour merger »
#
# Rien d'autre : ni échecs de workflows, ni labels de validation.
# (Décision propriétaire 23/08 : uniquement la création de PR -
# le reste était du spam et mangeait le quota Pushinator.)
#
# Le token vit dans env.sh du runner (jamais un secret GitHub : les workflows
# exécutent du contenu non maîtrisé côté validation).

name: Notifier (téléphone)

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: read

jobs:
  notifier:
    if: startsWith(github.head_ref, 'fiche/')
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Push téléphone (PR créée)
        run: |
          . /opt/francepassoire-shared/env.sh
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          curl -s "https://api.pushinator.com/api/v2/notifications/send" \
            -X POST -H "Authorization: Bearer $PUSHINATOR_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(printf '{"channel_id": "%s", "content": "%s"}' "$PUSHINATOR_CHANNEL" "FrancePassoire : nouvelle fiche en attente. PR #${PR_NUM} ${PR_TITLE} - validee par l'agent, un tap pour merger.")" >/dev/null || true
